name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the point of committing one.
      - run: npm ci

      # `RouteContext<"/api/trips/[id]">` and friends are *generated*, not written, so on a
      # fresh checkout there is nothing for tsc to resolve them against. This is why the
      # first CI run failed while the same command passed locally: a `.next/types` from an
      # earlier build was sitting there. `typegen` writes them without a full build.
      - name: Route types
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src scripts

      - name: Build
        run: npm run build

      # Eleven suites, each against its own server and its own empty database — see the
      # script for why one shared server does not work. They talk to the Frankfurter rate
      # API for the currency assertions, which is the one thing here that can fail for
      # reasons that have nothing to do with this code.
      - name: Test
        run: ./scripts/run-suites.sh

      # Aparte de las anteriores porque necesita justo lo que aquéllas apagan: un
      # proveedor de identidad configurado. Es el hueco por el que se colaron una
      # página de invitación y un borrado de cuenta que solo funcionaban sin él.
      # Ver scripts/test-identity.sh.
      # También con proveedor, y además con uno que FIRMA: el aviso de cierre
      # de sesión solo se puede probar de verdad si alguien emite logout_token
      # válidos. Ver scripts/test-backchannel.sh.
      - name: Back-channel logout
        run: npm run test:backchannel

      - name: What changes when identity is delegated
        run: npm run test:identity

      - name: Recurring dates outside UTC
        run: TZ=Europe/Madrid npm run test:recurring

      - name: Server log on failure
        if: failure()
        run: tail -40 /tmp/*.log 2>/dev/null || true
